</div>
</section>

<tr><td class="k">자료</td><td>매번 골라서 올리기</td><td class="good">폴더에서 바로 읽기</td></tr>

</section>

<h1 id="%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8-%ED%9D%90%EB%A6%84%EB%A7%88%EB%8B%A4-%EB%A7%A1%EA%B8%B8-%EC%9D%BC%EC%9D%B4-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4">프로젝트 흐름마다 맡길 일이 있습니다</h1>

<div class="st"><strong>기획·수주</strong><span>제안서 초안<br />대지 조건 정리</span><em>초안</em></div>

<div class="st"><strong>현장·감리</strong><span>사진 정리<br />감리 기록 초안</span><em>분류·기록</em></div>
<div class="st blue"><strong>발표·납품</strong><span>렌더·이미지<br />설명 자료</span><em>시각화</em></div>
</div>
</section>

<h1 id="%EC%9D%B4%EB%A0%87%EA%B2%8C-%EC%8B%9C%ED%82%A4%EB%A9%B4-%EC%9D%B4%EA%B1%B8-%EB%B0%9B%EC%8A%B5%EB%8B%88%EB%8B%A4">이렇게 시키면, 이걸 받습니다</h1>
<div class="cards6">
<div class="ex"><div class="tag2">인허가</div><h3>법규 검토</h3><div class="say2">"이 대지 용도지역 기준으로 건폐율, 용적률, 높이 제한 조항 찾아 줘"</div><div class="get">조항 원문 링크가 달린 검토 체크리스트</div></div>
<div class="ex"><div class="tag2">계획설계</div><h3>면적표</h3><div class="say2">"층별 면적 엑셀로 개요표 만들고 합계 검산해 줘"</div><div class="get">개요표 초안과 틀린 합계 표시</div></div>
<div class="ex"><div class="tag2">실시설계</div><h3>회의 정리</h3><div class="say2">"오늘 회의 메모에서 도면 수정 요청만 뽑아 줘"</div><div class="get">도면 번호별 수정 목록</div></div>
<div class="ex"><div class="tag2">기획·수주</div><h3>제안서</h3><div class="say2">"지난 근생 프로젝트 폴더 참고해서 제안서 초안 써 줘"</div><div class="get">우리 사무소 문서 구조를 따른 초안</div></div>
<div class="ex"><div class="tag2">현장·감리</div><h3>현장 사진</h3><div class="say2">"이번 주 현장 사진을 날짜와 공정별로 나눠 줘"</div><div class="get">정리된 폴더와 감리 기록 초안</div></div>
<div class="ex blue"><div class="tag2">발표·납품 · 오늘 실습</div><h3>렌더</h3><div class="say2">"S01 캡처를 골든아워로, 사람 두세 명 넣어서"</div><div class="get">형태는 그대로 둔 렌더 시안</div></div>
</div>
